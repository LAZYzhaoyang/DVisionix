[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 允许 import 非置顶（re-export 风格）
"**/__init__.py" = ["E402"]
# 测试文件允许一行多语句与歧义变量名（__main__ 便利块）
"tests/**" = ["E402", "E702", "E741"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 未注册的 marker 直接报错，避免拼写错误被静默忽略（CodePlan 7.2 步骤 0-5）
addopts = "--strict-markers"
markers = [
    "unit: 纯单元测试，无外部依赖",
    "integration: 组件装配级测试（构建 task/loss/trainer 等）",
    "slow: 耗时测试（官方配置端到端门禁等），可用 -m 'not slow' 跳过",
    "cuda: 需要 CUDA 设备",
    "ddp: 需要多进程 / 多卡分布式环境",
]

# DVisionix 打包与工具配置。
#
# 依赖、版本、元数据的**唯一来源**就是本文件：
# - 运行依赖 -> [project].dependencies
# - 可选依赖 -> [project.optional-dependencies]
# - 版本号   -> dvisionix/__init__.py 的 __version__（见 [tool.setuptools.dynamic]）
# requirements.txt 仅为兼容 `pip install -r` 习惯而保留，内容是指向本文件的指针，
# 不再单独声明任何版本（v1.0.0 曾出现 timm>=0.16.0 与 >=0.9.0 漂移、pillow 只在单侧声明）。

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvisionix"
dynamic = ["version"]
description = "A modular, config-driven PyTorch computer-vision algorithm toolbox"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhaoyang Li" }]
keywords = [
    "pytorch",
    "computer-vision",
    "image-classification",
    "object-detection",
    "semantic-segmentation",
    "self-supervised-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0,<3",
    "torchvision>=0.15",
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "pyyaml>=6.0",
    "tensorboard>=2.11.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
# 模型导出
export = ["onnx>=1.13.0", "onnxruntime>=1.14.0"]
# 第三方骨干
models = ["timm>=0.16.0"]
# 数据增强
datasets = ["albumentations>=1.3.0"]
# COCO 评估
coco = ["pycocotools>=2.0.6"]
# 可选指标后端
metrics = ["torchmetrics>=1.0.0"]
# 开发与 CI
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pip-audit>=2.6.0",
]
# 一次性装齐（显式列举而非自引用，避免解析器差异）
full = [
    "onnx>=1.13.0",
    "onnxruntime>=1.14.0",
    "timm>=0.16.0",
    "albumentations>=1.3.0",
    "pycocotools>=2.0.6",
    "torchmetrics>=1.0.0",
]

[project.urls]
Repository = "https://github.com/LAZYzhaoyang/DVisionix"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
# 只打包 dvisionix 本体；tests / tools / configs / docs 均不属于发行物
# （v1.0.0 的 `find_packages()` 会把 tests* 一起打进 wheel）。
include = ["dvisionix*"]
exclude = ["tests*", "tools*", "configs*", "docs*"]

[tool.setuptools.package-data]
# `Config.from_default()` 从**安装目录**读取这些 YAML；不声明则 wheel 里没有它们，
# 非 editable 安装必然失败（CodePlan 7.1.2 D14）。
dvisionix = ["config/defaults/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "dvisionix.__version__" }

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 允许 import 非置顶（re-export 风格）
"**/__init__.py" = ["E402"]
# 测试文件允许一行多语句与歧义变量名（__main__ 便利块）
"tests/**" = ["E402", "E702", "E741"]

[tool.mypy]
files = ["dvisionix"]
# 说明：这不是「项目最低版本」，而是 mypy **解析依赖 stub 时**必须接受的语法版本。
# 项目本身的下限由 [project].requires-python（>=3.10）与 CI 矩阵（3.10/3.11/3.12）保证。
#
# 为什么不能写成 3.10：numpy>=2 的 stub（numpy/__init__.pyi）使用了 PEP 695 的
# `type` 语句，该语法要求 3.12+；写成 3.10 会让 mypy 直接拒绝运行
# （`Type statement is only supported in Python 3.12 and greater`，errors prevented
#  further checking）。而 stub 文件不受 follow_imports=skip 影响，无法通过 override 跳过。
# v1.0.0 原本写的是 "3.8"，比项目下限还低，同样无法运行。
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

# 注意（mypy 基线）：当前 `mypy dvisionix` 报告 121 个错误 / 39 个文件，
# 因此 CI 中 mypy 是非阻断步骤。收紧范围或修复后请同步更新 CodePlan 7.6 的记录。

[tool.coverage.run]
source = ["dvisionix"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 未注册的 marker 直接报错，避免拼写错误被静默忽略（CodePlan 7.2 步骤 0-5）
addopts = "--strict-markers"
markers = [
    "unit: 纯单元测试，无外部依赖",
    "integration: 组件装配级测试（构建 task/loss/trainer 等）",
    "slow: 耗时测试（官方配置端到端门禁等），可用 -m 'not slow' 跳过",
    "cuda: 需要 CUDA 设备",
    "ddp: 需要多进程 / 多卡分布式环境",
]

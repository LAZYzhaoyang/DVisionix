# DVisionix 基础配置
# 所有任务的默认配置都继承此文件

training:
  num_epochs: 50
  batch_size: 32
  # 优化器 / 调度器由配置驱动（Task 不再硬编码）
  optimizer:
    type: adam
    lr: 0.001
    weight_decay: 0.0001
  scheduler: {type: reduce_on_plateau, monitor: val_loss, factor: 0.5, patience: 3}
  device: auto
  num_workers: 0
  seed: 42
  strategy: auto          # auto / ddp / none
  devices: null           # DDP 设备列表，如 [0, 1]
  amp: false
  accumulate_grad_batches: 1
  gradient_clip_val: null
  log_interval: 50
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 10
    min_delta: 0.0001

checkpoint:
  save_dir: checkpoints    # 相对于 work_dir
  monitor: val_loss
  mode: min
  save_best_only: true
  save_last: true

# 工作目录（默认在代码库外 ~/dvisionix_runs/<experiment>/<timestamp>，
# 可用 DVISIONIX_WORK_DIR 环境变量或此处覆盖）
work_dir: null
resume: false              # false / auto / latest / <checkpoint path>

data:
  root: ./data
  image_size: 224
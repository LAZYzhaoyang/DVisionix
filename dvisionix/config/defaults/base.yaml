# DVisionix 基础配置
# 所有任务的默认配置都继承此文件

training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "reduce_on_plateau"
  device: "auto"
  num_workers: 0
  seed: 42
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
  grad_clip:
    enabled: false
    max_norm: 1.0
  amp: false

checkpoint:
  save_dir: "./checkpoints"
  save_best: true
  save_latest: true
  save_interval: 1

logging:
  log_dir: "./logs"
  log_interval: 50
  tensorboard: true

data:
  root: "./data"
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

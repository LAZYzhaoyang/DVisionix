# 检测任务默认配置（继承 base.yaml）
_base_: "base.yaml"

task_type: "detection"

model:
  name: "grid_detection"
  num_classes: 3
  in_channels: 3
  width: 64

loss:
  type: "grid_detection"
  # num_classes 由入口按 model.num_classes 自动注入
  obj_weight: 1.0
  box_weight: 5.0
  cls_weight: 1.0

data:
  root: "./data"
  dataset: "coco"
  image_size: 640

training:
  batch_size: 16
  optimizer:
    type: adam
    lr: 0.01
    weight_decay: 0.0001
# DeepLabV3 分割端到端 demo 配置
_base_: "../../dvisionix/config/defaults/segmentation.yaml"

experiment_name: "demo_deeplabv3_synthetic"

model:
  _delete_: true
  type: "segmentation_model"
  num_classes: 3
  backbone:
    type: "timm_backbone"
    name: "resnet18"
    pretrained: false
    features_only: true
    out_indices: [4]
  head:
    type: "deeplabv3_head"
    num_classes: 3

loss:
  _delete_: true
  type: "cross_entropy"
  ignore_index: 255

data:
  dataset: "synthetic"
  image_size: 64
  num_samples: 64
  val_samples: 16

training:
  num_epochs: 1
  batch_size: 4
  optimizer: {type: adam, lr: 0.001, weight_decay: 0.0001}
  device: "auto"
  num_workers: 0
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_loss"
  mode: "min"
# 线性评估 demo 配置（自监督预训练 -> 冻结 encoder + 线性头）
_base_: "../../dvisionix/config/defaults/classification.yaml"

experiment_name: "demo_linear_eval"

model:
  _delete_: true
  type: "linear_classifier"
  num_classes: 10
  # 预训练 checkpoint（SimCLR 训练产物或 EMA 导出），自动加载到 backbone 并冻结
  pretrained_backbone: "/path/to/pretrained_checkpoint.pt"
  backbone:
    type: "sequential_backbone"
    features_only: false
    stages:
      - {type: conv_norm_act, in_channels: 3, out_channels: 16, stride: 2}
      - {type: conv_norm_act, in_channels: 16, out_channels: 32, stride: 2}
      - {type: conv_norm_act, in_channels: 32, out_channels: 64, stride: 2}
  head:
    type: "cls_head"
    num_classes: 10

task:
  type: "LinearEvalTask"
  num_classes: 10
  feature_norm: true

loss:
  _delete_: true
  type: "cross_entropy"

data:
  dataset: "synthetic"
  image_size: 32
  num_samples: 64
  val_samples: 16

training:
  num_epochs: 5
  batch_size: 8
  optimizer: {type: adam, lr: 0.01}
  scheduler: {type: cosine, T_max: 5}
  device: "auto"
  num_workers: 0
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_accuracy"
  mode: "max"

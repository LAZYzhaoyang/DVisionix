# DVX 数据集规格示例：labelme 语义分割
#
# 用法：复制到数据根目录并改名为 dvx_dataset.yaml，按 TODO 修改后执行：
#   python tools/check_dataset.py --spec <数据根目录>/dvx_dataset.yaml --split-preview
#
# 目录要求：每张图片旁边有同名的 <stem>.json；segmentation 只保留 polygon，
# 掩码在取样本时由多边形栅格化（未覆盖像素填 0）。
# 本文件是 DVX 数据集规格（dvx_dataset.yaml），不是训练配置。
# 注意：classes 的顺序就是 label id（__background__ 必须是 0）。
version: 1

data_type: segmentation

layout: labelme

# TODO 必须改：数据集根目录，相对“本 yaml 所在目录”解析；也支持绝对路径。
root: ./data/my_seg

# TODO 必须改：0 号固定为 __background__，后面按你的标注顺序排列。
# 未覆盖的像素由 rasterize 填 0，因此背景类必须占 0 号。
classes:
  - __background__
  - road
  - sky

seg_mode: semantic            # 本期只实现 semantic；query 是保留值

# 训练侧忽略像素值（CrossEntropy / mIoU 使用）。
# 注意：当前 DVXDataset 栅格化背景固定为 0，尚未消费该字段；
# P2 接线训练时请让训练配置的 ignore_index 与这里保持一致。
ignore_index: 255

splits:
  mode: ratio
  ratio: {train: 0.8, val: 0.2}
  seed: 42
  stratify: none

parse:
  recursive: true             # false 时只看 root 本层，不进入子目录
  image_ext: [.jpg, .jpeg, .png, .bmp]
  labelme:
    # __background__ 同时出现在这里：标注 JSON 中的同名形状会被丢弃，
    # 不会变成目标 id 0；背景由栅格化的 background=0 表达。
    ignore_labels: [__ignore__, __background__]
    image_data: ignore        # ignore：容忍内嵌 imageData 并告警；error：直接报错
    shape_types: {rectangle: detection, polygon: segmentation}

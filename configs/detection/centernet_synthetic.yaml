# CenterNet（关键点检测）端到端 demo 配置
_base_: "../../dvisionix/config/defaults/detection.yaml"

experiment_name: "demo_centernet_synthetic"

model:
  _delete_: true
  type: "centernet"
  num_classes: 3
  stride: 8
  backbone:
    type: "sequential_backbone"
    features_only: true
    stages:
      - {type: conv_norm_act, in_channels: 3, out_channels: 16, stride: 4}
      - {type: conv_norm_act, in_channels: 16, out_channels: 32, stride: 2}
  head:
    type: "centernet_head"
    num_classes: 3

loss:
  _delete_: true
  type: "centernet_detection"
  stride: 8

data:
  dataset: "synthetic"
  image_size: 64
  num_samples: 64
  val_samples: 16
  max_boxes: 3

training:
  num_epochs: 1
  batch_size: 4
  optimizer: {type: adam, lr: 0.001, weight_decay: 0.0001}
  device: "auto"
  num_workers: 0
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_loss"
  mode: "min"

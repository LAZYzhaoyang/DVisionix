# DINO-lite（hybrid query selection + 去噪训练）端到端 demo 配置
_base_: "../../dvisionix/config/defaults/detection.yaml"

experiment_name: "demo_dino_synthetic"

model:
  _delete_: true
  type: "dinodetr"
  num_classes: 3
  backbone:
    type: "sequential_backbone"
    features_only: true
    stages:
      - {type: conv_norm_act, in_channels: 3, out_channels: 16, stride: 2}
      - {type: conv_norm_act, in_channels: 16, out_channels: 32, stride: 2}
      - {type: conv_norm_act, in_channels: 32, out_channels: 64, stride: 2}
  head:
    type: "dino_head"
    num_classes: 3
    d_model: 64
    num_queries: 20
    num_encoder_layers: 1
    num_decoder_layers: 2
    num_heads: 4
    num_points: 2
    topk: 10

loss:
  _delete_: true
  type: "dino_detection"
  num_classes: 3

data:
  dataset: "synthetic"
  image_size: 64
  num_samples: 64
  val_samples: 16
  max_boxes: 3

training:
  num_epochs: 1
  batch_size: 4
  optimizer: {type: adam, lr: 0.0001}
  device: "auto"
  num_workers: 0
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_loss"
  mode: "min"

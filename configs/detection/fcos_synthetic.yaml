# FCOS（anchor-free）端到端 demo 配置
_base_: "../../dvisionix/config/defaults/detection.yaml"

experiment_name: "demo_fcos_synthetic"

model:
  _delete_: true
  type: "fcos"
  num_classes: 3
  backbone:
    type: "timm_backbone"
    name: "resnet18"
    pretrained: false
    features_only: true
    out_indices: [1, 2, 3, 4]
  neck:
    type: "fpn"
    out_channels: 64
  head:
    type: "fcos_head"
    num_classes: 3
    strides: [4, 8, 16, 32]

loss:
  _delete_: true
  type: "fcos_detection"
  strides: [4, 8, 16, 32]
  scales: [0, 32, 64, 128, 256, 1000000000.0]

data:
  dataset: "synthetic"
  image_size: 64
  num_samples: 64
  val_samples: 16
  max_boxes: 3

training:
  num_epochs: 1
  batch_size: 4
  optimizer: {type: adam, lr: 0.001, weight_decay: 0.0001}
  device: "auto"
  num_workers: 0
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_loss"
  mode: "min"
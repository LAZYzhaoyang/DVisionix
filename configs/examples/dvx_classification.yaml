# DVX 分类任务示例配置（外部真实数据模板，不参与 CI 端到端门禁）
#
# 用途：把一份 dvx_dataset.yaml（data_type: classification）直接接进训练入口。
# data.spec 是**占位相对路径**，请替换为你的 dvx_dataset.yaml 实际位置（相对执行目录）。
#
# 用法::
#   python tools/train.py \
#     --config configs/examples/dvx_classification.yaml \
#     --cfg-options data.spec=/path/to/cls/dvx_dataset.yaml \
#     --work-dir /tmp/dvx_cls --force
#
# 要求：
# - spec 的 data_type 必须是 classification；
# - num_classes 必须与 spec 的类别数一致（本模板按 DVX 车型颜色 5 类填写）。
_base_: "../../dvisionix/config/defaults/classification.yaml"

experiment_name: "dvx_classification"

model:
  _delete_: true
  type: "linear_classifier"
  num_classes: 5
  # 项目内置骨干；features_only=False 时输出池化特征向量，接分类头
  backbone:
    type: "mobilenetv3_backbone"
    features_only: false
    width_mult: 1.0
  head:
    type: "cls_head"
    num_classes: 5

task:
  type: "ClassificationTask"
  num_classes: 5

data:
  dataset: "dvx"
  # 占位路径：指向你的 dvx_dataset.yaml（root 相对 spec 所在目录解析）
  spec: "./data/cls/dvx_dataset.yaml"
  image_size: 224

training:
  num_epochs: 1
  batch_size: 16
  optimizer: {type: adam, lr: 0.001, weight_decay: 0.0001}
  device: "auto"
  num_workers: 0
  amp: false
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_loss"
  mode: "min"

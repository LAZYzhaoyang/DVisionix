# DVX 检测任务示例配置（外部真实数据模板，不参与 CI 端到端门禁）
#
# 用途：把一份 dvx_dataset.yaml（data_type: detection，labelme 布局）接进训练入口。
# data.spec 是**占位相对路径**，请替换为你的 dvx_dataset.yaml 实际位置（相对执行目录）。
#
# 用法::
#   python tools/train.py \
#     --config configs/examples/dvx_detection.yaml \
#     --cfg-options data.spec=/path/to/det/dvx_dataset.yaml \
#     --work-dir /tmp/dvx_det --force
#
# 要求：
# - spec 的 data_type 必须是 detection；
# - num_classes 必须与 spec 的类别数一致（本模板按 DVX 检测 20 类填写）。
_base_: "../../dvisionix/config/defaults/detection.yaml"

experiment_name: "dvx_detection"

model:
  _delete_: true
  type: "yolo"
  num_classes: 20
  # 参考 configs/detection/yolov5_synthetic.yaml：CSP 骨干 + PANet + YOLOHead
  backbone:
    type: "sequential_backbone"
    features_only: true
    stages:
      - {type: conv_norm_act, in_channels: 3, out_channels: 16, stride: 4}
      - {type: conv_norm_act, in_channels: 16, out_channels: 32, stride: 2}
      - [
          {type: conv_norm_act, in_channels: 32, out_channels: 64, stride: 2},
          {type: csp_layer, in_channels: 64, out_channels: 64, num_blocks: 2},
        ]
      - [
          {type: conv_norm_act, in_channels: 64, out_channels: 128, stride: 2},
          {type: csp_layer, in_channels: 128, out_channels: 128, num_blocks: 2},
        ]
  neck:
    type: "panet"
    out_channels: 64
  head:
    type: "yolo_head"
    num_classes: 20
    strides: [4, 8, 16, 32]

task:
  type: "DetectionTask"
  num_classes: 20

loss:
  _delete_: true
  type: "yolo_detection"
  strides: [4, 8, 16, 32]
  topk: 13

data:
  dataset: "dvx"
  # 占位路径：指向你的 dvx_dataset.yaml（root 相对 spec 所在目录解析）
  spec: "./data/det/dvx_dataset.yaml"
  image_size: 512

training:
  num_epochs: 1
  batch_size: 4
  optimizer: {type: adam, lr: 0.001, weight_decay: 0.0001}
  device: "auto"
  num_workers: 0
  amp: false
  early_stopping: {enabled: false}

checkpoint:
  save_dir: "checkpoints"
  monitor: "val_loss"
  mode: "min"
